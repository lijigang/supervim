name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app
          else
            XCODE="$(ls -d /Applications/Xcode*.app | sort | tail -n 1)"
            sudo xcode-select -s "$XCODE"
          fi
          xcodebuild -version
          swift --version
          swift --version | grep -E 'Swift version 6\.'

      - name: Build
        run: swift build

      - name: Test
        env:
          SUPERVIM_LIVE_AX_BENCH: "1"
        run: swift test

      - name: Render UI snapshots
        run: scripts/render-ui-snapshots.sh build/ui-snapshots

      - name: Upload UI snapshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: build/ui-snapshots
          if-no-files-found: error

      - name: Measure ModeMachine coverage
        run: scripts/mode-machine-coverage.sh

      - name: Measure KeyParser coverage
        run: scripts/key-parser-coverage.sh

      - name: Measure HintLabeler coverage
        run: scripts/hint-labeler-coverage.sh

      - name: Measure CommandMap coverage
        run: scripts/command-map-coverage.sh

      - name: Measure Settings coverage
        run: scripts/settings-coverage.sh

      - name: Measure EventTap coverage
        run: scripts/event-tap-coverage.sh

      - name: Measure Actuator coverage
        run: scripts/actuator-coverage.sh

      - name: Measure AXScanner coverage
        run: scripts/ax-scanner-coverage.sh

      - name: Measure menu bar coverage
        run: scripts/menu-bar-coverage.sh

      - name: Measure hint overlay coverage
        run: scripts/hint-overlay-coverage.sh

      - name: Measure command session coverage
        run: scripts/command-session-coverage.sh

      - name: Measure permission guide coverage
        run: scripts/permission-guide-coverage.sh

      - name: Measure help overlay coverage
        run: scripts/help-overlay-coverage.sh

      - name: Measure login item coverage
        run: scripts/login-item-coverage.sh

      - name: Check committed app icon
        run: scripts/make-icon.sh --check

      - name: Assemble unsigned menu-bar app
        run: scripts/assemble-app.sh

      - name: Verify menu-bar bundle contract
        run: |
          PLIST="build/Supervim.app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$PLIST")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")" = "Supervim"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$PLIST")" = "13.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$PLIST")" = "APPL"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = "com.lijigang.supervim"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$PLIST")" = "AppIcon"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          test -x build/Supervim.app/Contents/MacOS/Supervim
          test -s build/Supervim.app/Contents/Resources/AppIcon.icns

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Package DMG
        env:
          SUPERVIM_SIGNING_P12_BASE64: ${{ secrets.SUPERVIM_SIGNING_P12_BASE64 }}
          SUPERVIM_SIGNING_P12_PASSWORD: ${{ secrets.SUPERVIM_SIGNING_P12_PASSWORD }}
        run: scripts/package-dmg.sh build/Supervim.app build/Supervim.dmg

      - name: Mount DMG and verify layout
        run: scripts/verify-dmg.sh build/Supervim.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Supervim-dmg
          path: build/Supervim.dmg
          if-no-files-found: error
