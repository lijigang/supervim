name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number without a leading v, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app
          else
            XCODE="$(ls -d /Applications/Xcode*.app | sort | tail -n 1)"
            sudo xcode-select -s "$XCODE"
          fi
          xcodebuild -version
          swift --version
          swift --version | grep -E 'Swift version 6\.'

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Version must look like 0.1.0, got: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip when this tag already has the DMG
        id: skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ASSET="Supervim-${{ steps.version.outputs.version }}.dmg"
          NAMES="$(gh release view "${{ steps.version.outputs.tag }}" --json assets --jq '.assets[].name' || true)"
          if printf '%s\n' "$NAMES" | grep -qx "$ASSET"; then
            echo "Release already has $ASSET"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install create-dmg
        if: steps.skip.outputs.skip != 'true'
        run: brew install create-dmg

      - name: Assemble release app
        if: steps.skip.outputs.skip != 'true'
        run: scripts/assemble-app.sh release "${{ steps.version.outputs.version }}"

      - name: Package DMG
        if: steps.skip.outputs.skip != 'true'
        env:
          SUPERVIM_SIGNING_P12_BASE64: ${{ secrets.SUPERVIM_SIGNING_P12_BASE64 }}
          SUPERVIM_SIGNING_P12_PASSWORD: ${{ secrets.SUPERVIM_SIGNING_P12_PASSWORD }}
        run: scripts/package-dmg.sh build/Supervim.app "build/Supervim-${{ steps.version.outputs.version }}.dmg"

      - name: Verify DMG
        if: steps.skip.outputs.skip != 'true'
        run: scripts/verify-dmg.sh "build/Supervim-${{ steps.version.outputs.version }}.dmg"

      - name: Publish GitHub Release
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPERVIM_SIGNING_P12_BASE64: ${{ secrets.SUPERVIM_SIGNING_P12_BASE64 }}
          SUPERVIM_SIGNING_P12_PASSWORD: ${{ secrets.SUPERVIM_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          DMG="build/Supervim-${VERSION}.dmg"
          if [[ -n "${SUPERVIM_SIGNING_P12_BASE64:-}" && -n "${SUPERVIM_SIGNING_P12_PASSWORD:-}" ]]; then
            SIGNING_NOTE="Signed with the project's stable self-signed certificate. Accessibility and Input Monitoring survive later upgrades. The app is not notarized, so Gatekeeper still warns the first time. See docs/stable-signing.md."
          else
            SIGNING_NOTE="Ad-hoc signed because the stable signing secret was not configured. Each build will ask for Accessibility and Input Monitoring again. See docs/stable-signing.md."
          fi
          NOTES="$(cat <<EOF
          Supervim ${VERSION}.

          Drag Supervim.app to Applications.

          ${SIGNING_NOTE}
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" "$DMG" \
              --title "Supervim ${VERSION}" \
              --notes "$NOTES" \
              --target "${{ github.sha }}"
          fi
